name: Validate irradiance against ground stations
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "tools/validate_stations.py" ]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_stations.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/validation || true
          git commit -m "Add ground-station check of PVGIS irradiance" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*10)); done; exit 1
