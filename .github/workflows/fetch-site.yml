name: Fetch site geometry
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "tools/fetch_site.py" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_site.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site
          git commit -m "Add Faqra site geometry from OpenStreetMap" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*10)); done; exit 1
